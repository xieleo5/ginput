name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-bin librime-dev librime-plugin-lua rime-data-pinyin-simp rime-prelude fcitx-libs-dev libx11-dev python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 xvfb
      - name: Unit and real Rime integration tests
        env:
          GINPUT_REQUIRE_RIME: '1'
          GINPUT_REQUIRE_PANEL: '1'
          GINPUT_REQUIRE_UI: '1'
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile native candidate panel
        run: cc -std=gnu11 -Wall -Wextra -Werror -fPIC -shared -isystem /usr/include native/panel.c -lX11 -o /tmp/fcitx-ginput-panel.so
  macos-tooling:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Squirrel source installer and package contracts (no live input source)
        run: python3 -m unittest discover -s tests -p 'test_macos.py' -v
      - name: Verify install shell syntax
        run: bash -n platforms/macos/install.command
