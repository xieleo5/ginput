[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-input"
version = "0.3.0"
description = "Linux Pinyin input method with local dictionary management"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Guitar"}]

[project.scripts]
ginput = "ginput.cli:main"

[tool.setuptools.packages.find]
include = ["ginput*"]

[tool.setuptools.package-data]
ginput = ["rime/*.yaml", "examples/*.tsv"]
