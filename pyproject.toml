[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-input"
version = "0.6.0"
description = "Cross-platform Rime Pinyin input with local dictionary management"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Guitar"}]

[project.scripts]
ginput = "ginput.cli:main"

[tool.setuptools.packages.find]
include = ["ginput*"]

[tool.setuptools.package-data]
ginput = ["rime/*.yaml", "rime/*.lua", "examples/*.tsv"]
