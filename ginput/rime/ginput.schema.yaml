schema:
  schema_id: ginput
  name: Guitar Input · 拼音
  version: '0.5.0'
  author: [Guitar]
  description: 本地个人词库、全拼简拼、常见换序与邻键容错、输入习惯学习。
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
  - name: ascii_punct
    reset: 1
    states: [。，, ．，]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator, lua_translator@ginput_correction]
  filters: [lua_filter@ginput_ranking, uniquifier]
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " "
  algebra:
    # Syllabic n/m otherwise take precedence over initials in nhao, etc.
    - erase/^(hm|m|n|ng)$/
    # v aliases yu (v/van/ve/vn); nv and lv retain their ü spelling.
    - derive/^yu(.*)$/v$1/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/

translator:
  dictionary: ginput
  user_dict: ginput
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  # The Lua layer applies one edit to the entire input; no recursive syllable edits.
  enable_correction: false
  spelling_hints: 64
  always_show_comments: true
  preedit_format:
    - xform/([nl])v/$1ü/
menu:
  page_size: 5
punctuator:
  import_preset: default
key_binder:
  # Punctuation commits ASCII characters; PageUp/PageDown handle paging.
  bindings: []
recognizer:
  import_preset: default
  patterns:
    # @ must commit the current Chinese candidate and remain ASCII punctuation.
    email: '^$'
